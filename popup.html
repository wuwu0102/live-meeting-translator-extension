<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Meeting Translator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-body">
    <main class="panel">
      <h1>Live Meeting Translator</h1>
      <p class="status-label">Status</p>
      <p id="statusText" class="status idle">Idle</p>
      <div class="actions">
        <button id="startBtn" class="btn btn-primary">Start Translation</button>
        <button id="stopBtn" class="btn btn-danger">Stop</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
